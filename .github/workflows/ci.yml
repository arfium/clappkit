# CI for the crate every clapp is built on. A break here breaks all of them at once, and
# nothing else runs these tests — each app's CI compiles clappkit but exercises its own
# code, not this one's.
#
# clappkit depends on the clatch pipe crates as LOCAL path crates in this workspace
# (crates/clapp-ipc, crates/clapp-pipe): no ssh://, no key, no vendored copy — a fresh
# clone builds. So CI tests the whole workspace, adversarial framing tests included.
#
# MANUAL ONLY (`gh workflow run CI`, or the Actions tab). No push or pull_request trigger:
# GitHub Actions minutes are the constraint across this family, and the real gate is the
# local `npm run verify`, which opens a window and proves the two surfaces talk - no
# headless runner can. Two jobs, both on manual dispatch:
#   * quick (ubuntu, 1x): `cargo test --workspace` - the WHOLE workspace, or the clapp-ipc
#     adversarial framing tests and clapp-pipe never run; clippy and audit report but do
#     not fail (the crate is not lint-clean yet).
#   * platforms (macOS + Windows, 10x): where the cfg branches differ (unix 0700 vs a
#     Windows ACL, a unix socket vs a named pipe).
name: CI

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The library's own logic on the platform that bills at 1x.
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # The whole workspace, --all-features: without --workspace the clapp-ipc framing
      # tests (the adversarial-input ones) and clapp-pipe never run at all. Several tests
      # touch the process-global CLATCH_DATA_DIR, so ENV_LOCK serialises them; run in
      # parallel deliberately, which is what caught that ordering bug in the first place.
      - name: Test (workspace)
        run: cargo test --workspace --all-features

      # Report-only for now (see the header): surfaces lints and advisories without a
      # red-on-arrival gate. Promote to hard gates once the crate is clean.
      - name: Clippy
        continue-on-error: true
        run: cargo clippy --workspace --all-features --all-targets

      - name: Audit
        continue-on-error: true
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Run audit
        continue-on-error: true
        run: cargo audit

  # The two platforms the family ships, where the cfg branches actually differ. MANUAL
  # (workflow_dispatch): 10x runners across fifteen repos are not a push-and-PR budget.
  platforms:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Stop Defender scanning the build (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}","$env:USERPROFILE\.cargo","$env:USERPROFILE\.rustup" -ErrorAction SilentlyContinue
          Write-Host "excluded: workspace, ~/.cargo, ~/.rustup"

      # No `cargo fmt --check` here on purpose: the crate is not fmt-clean today (41
      # blocks), so the gate would be red on arrival. Reformat first, then add it.
      - name: Test (workspace)
        run: cargo test --workspace --all-features
