[package]
name = "clapp-pipe"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The Clatch app control pipe: the reference Rust binding (clatch_init, register, signals)"
repository = "https://github.com/arfium/clappkit"

[dependencies]
clapp-ipc = { path = "../clapp-ipc", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
